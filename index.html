<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSJILP</title>
    <style>
      :root {
        --bg: #000000;
        --fg: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: clamp(12px, 2vw, 40px);
      }

      h1 {
        margin: 0;
        font-size: clamp(7rem, 28vw, 52rem);
        line-height: 0.8;
        letter-spacing: -0.08em;
        font-weight: 900;
        text-transform: uppercase;
        text-align: center;
        white-space: nowrap;
      }

      @media (max-width: 640px) {
        h1 {
          white-space: normal;
          font-size: clamp(5rem, 30vw, 20rem);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1>TSJILP</h1>
    </div>
  </body>
</html>
