<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSJILP</title>
    <style>
      :root {
        --bg: #000000;
        --fg: #f4f4f4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--bg);
        color: var(--fg);
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      }

      .frame {
        width: calc(100vw - 20px);
        height: calc(100vh - 20px);
        margin: 10px;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      h1 {
        margin: 0;
        padding: 0;
        color: var(--fg);
        font-weight: 900;
        font-size: clamp(18rem, 60vw, 130rem);
        line-height: 0.72;
        letter-spacing: -0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        transform: scaleY(1.1);
        user-select: none;
      }

      .particle {
        position: fixed;
        pointer-events: none;
        font-size: clamp(10px, 2vw, 22px);
        font-weight: 700;
        color: var(--fg);
        font-family: Arial, sans-serif;
        opacity: 0;
        animation: float-up 1.5s ease-out forwards;
        z-index: 1000;
      }

      @keyframes float-up {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(0.55);
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <h1>TSJILP</h1>
    </div>

    <script>
      const words = ['TSJILP', 'tsjilp', 'Tsjilp', 'TJILP', 'sjilp'];
      let mouseX = 0;
      let mouseY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      document.addEventListener('mousemove', () => {
        if (Math.random() > 0.72) createParticle();
      });

      function createParticle() {
        const particle = document.createElement('div');
        particle.classList.add('particle');

        const word = words[Math.floor(Math.random() * words.length)];
        particle.textContent = word;

        const angle = Math.random() * Math.PI * 2;
        const distance = 30 + Math.random() * 80;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);

        const offsetX = (Math.random() - 0.5) * 35;
        const offsetY = (Math.random() - 0.5) * 35;

        particle.style.left = (mouseX + offsetX) + 'px';
        particle.style.top = (mouseY + offsetY) + 'px';

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1500);
      }
    </script>
  </body>
</html>
