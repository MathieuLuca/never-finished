<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSJILP</title>
    <style>
      :root {
        --bg: #000000;
        --fg: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .stage {
        width: calc(100vw - 20px);
        height: calc(100vh - 20px);
        margin: 10px;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      text {
        fill: var(--fg);
        font-family: Impact, Arial Black, sans-serif;
        font-weight: 900;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      /* Floating text particles around cursor */
      .particle {
        position: fixed;
        pointer-events: none;
        font-size: clamp(8px, 2vw, 24px);
        font-weight: bold;
        color: var(--fg);
        font-family: Arial, sans-serif;
        opacity: 0;
        animation: float-up 1.5s ease-out forwards;
        z-index: 1000;
      }

      @keyframes float-up {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(0.5);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
        <text x="50%" y="50%" font-size="900">TSJILP</text>
      </svg>
    </div>

    <script>
      const words = ['TSJILP', 'tsjilp', 'Tsjilp', 'TJILP', 'sjilp'];
      
      // Track mouse position
      let mouseX = 0;
      let mouseY = 0;
      
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      // Create floating text particles on mouse move
      document.addEventListener('mousemove', () => {
        // Random chance to spawn a particle
        if (Math.random() > 0.7) {
          createParticle();
        }
      });

      function createParticle() {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // Random word
        const word = words[Math.floor(Math.random() * words.length)];
        particle.textContent = word;
        
        // Random angle around cursor
        const angle = Math.random() * Math.PI * 2;
        const distance = 40 + Math.random() * 60;
        
        // End position (float away)
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        
        // Random offset from cursor
        const offsetX = (Math.random() - 0.5) * 30;
        const offsetY = (Math.random() - 0.5) * 30;
        
        particle.style.left = (mouseX + offsetX) + 'px';
        particle.style.top = (mouseY + offsetY) + 'px';
        
        document.body.appendChild(particle);
        
        // Remove particle after animation
        setTimeout(() => {
          particle.remove();
        }, 1500);
      }
    </script>
  </body>
</html>
